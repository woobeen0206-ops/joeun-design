<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>조은 디자인 명함 인쇄용</title>
  <style>
    @page{size:90mm 50mm;margin:0}
    html,body{margin:0;padding:0;background:#fff}
    .card{width:90mm;height:50mm;break-after:page;page-break-after:always}
    .card:last-child{break-after:auto;page-break-after:auto}
    svg{display:block;width:90mm;height:50mm}
  </style>
</head>
<body>
  <div class="card"><img src="svg/joeun-design-business-card-front.svg" alt="명함 앞면"></div>
  <div class="card"><img src="svg/joeun-design-business-card-back.svg" alt="명함 뒷면"></div>
</body>
</html>
