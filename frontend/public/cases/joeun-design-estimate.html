op:20px}.field label{font-size:13px;font-weight:700;display:block;margin-bottom:8px}.field input{width:100%;border:1px solid var(--line);border-radius:10px;padding:15px;font-size:16px;background:#fff}.field input:focus{outline:2px solid var(--green);border-color:var(--green)}.help-card{background:var(--cream);border-radius:12px;padding:18px;margin-top:23px;display:flex;gap:13px}.help-card b{font-size:14px;display:block}.help-card p{font-size:12px;color:var(--soft);margin-top:3px}.help-icon{width:31px;height:31px;flex:0 0 auto;border-radius:50%;background:var(--lime);display:grid;place-items:center}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#fffffff2;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:13px max(18px,calc((100vw - 760px)/2 + 22px)) max(13px,env(safe-area-inset-bottom))}.bottom-inner{max-width:716px;margin:auto;display:flex;gap:10px}.back{width:53px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:20px}.next{min-height:53px;flex:1;border:0;border-radius:10px;background:var(--green);color:#fff;font-weight:700;font-size:15px}.next:disabled{background:#d9ded8;color:#fff;cursor:not-allowed}.result{display:none;text-align:center;padding-top:22px}.result.show{display:block}.result-mark{width:66px;height:66px;margin:0 auto 20px;background:var(--lime);border-radius:50%;display:grid;place-items:center;font-size:31px}.result h2{font-size:28px;letter-spacing:-.06em}.result>p{font-size:14px;color:var(--soft);margin-top:12px}.summary{margin-top:27px;border:1px solid var(--line);border-radius:12px;text-align:left;overflow:hidden}.summary h3{font-size:14px;padding:16px;background:#f6f8f3}.summary div{padding:14px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;font-size:13px}.summary span{color:var(--soft)}.start-over{background:none;border:0;margin-top:24px;color:var(--soft);border-bottom:1px solid #b2bab1;font-size:13px}.skip{position:absolute;top:-100px;left:
