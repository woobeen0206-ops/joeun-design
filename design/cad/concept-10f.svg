<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
 <defs><style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#222831}.outer{stroke:#232a32;stroke-width:16;fill:none}.wall{stroke:#9b7651;stroke-width:9;fill:none}.glass{stroke:#2998ba;stroke-width:10;fill:none;stroke-dasharray:16 9}.door{stroke:#232a32;stroke-width:4;fill:none}.room{font-size:25px;font-weight:700;text-anchor:middle}.sub{font-size:17px;fill:#66707a;text-anchor:middle}.note{font-size:18px;fill:#4e5862}</style></defs>
 <rect width="1500" height="1000" fill="#f7f5f1"/>
 <text x="70" y="62" font-size="34" font-weight="800">10층 사무공간 · Model 기준 공간구성안</text>
 <text x="70" y="95" font-size="18" fill="#646c75">출입구·기존 구획을 기준으로 한 배치 초안 / 단위와 구조 치수는 원본 CAD 확인</text>
 <rect x="250" y="170" width="820" height="590" fill="#f2f0eb"/><path class="outer" d="M250 170H1070V760H250Z"/>
 <!-- Model geometry: VIP upper centre, open middle, support rooms on right, entrance projection below -->
 <path class="wall" d="M250 320H1070 M250 510H1070 M470 320V760 M780 320V760 M920 170V510 M900 510V760"/>
 <path class="glass" d="M250 170H1070 M250 170V510 M900 510H1060V760"/>
 <rect x="258" y="180" width="200" height="132" fill="#e8e4ee"/><rect x="478" y="180" width="292" height="132" fill="#eadfcd"/><rect x="790" y="180" width="270" height="132" fill="#e9e2d6"/>
 <rect x="258" y="330" width="200" height="170" fill="#e9edf0"/><rect x="478" y="330" width="292" height="170" fill="#e8eef1"/><rect x="790" y="330" width="270" height="170" fill="#e8e2d8"/>
 <rect x="258" y="520" width="200" height="230" fill="#e9edf0"/><rect x="478" y="520" width="292" height="230" fill="#f0e7da"/><rect x="790" y="520" width="100" height="230" fill="#e9dfcf"/><rect x="910" y="520" width="150" height="108" fill="#e5e2dc"/><rect x="910" y="640" width="150" height="110" fill="#e9dfcf"/>
 <text x="358" y="245" class="room">소회의실</text><text x="358" y="273" class="sub">4~6인</text>
 <text x="624" y="245" class="room">VIP실</text><text x="624" y="273" class="sub">외부 방문·비공개 미팅</text>
 <text x="925" y="245" class="room">대회의실</text><text x="925" y="273" class="sub">8~10인 / 방음</text>
 <text x="358" y="415" class="room">집중 업무실</text><text x="358" y="443" class="sub">프로듀싱·기획</text>
 <text x="624" y="415" class="room">오픈 업무공간</text><text x="624" y="443" class="sub">10~16석</text>
 <text x="925" y="415" class="room">협업·화상회의</text><text x="925" y="443" class="sub">가변 테이블·부스</text>
 <text x="358" y="625" class="room">갤러리·라운지</text><text x="358" y="653" class="sub">브랜드 전시</text>
 <text x="624" y="625" class="room">리셉션·공용업무</text><text x="624" y="653" class="sub">현관 중심</text>
 <text x="835" y="625" class="room" font-size="21">대표실</text><text x="835" y="653" class="sub">출입구 우측 유리방</text>
 <text x="985" y="568" class="room" font-size="21">화장실</text><text x="985" y="689" class="room" font-size="21">창고</text>
 <path class="outer" d="M560 760V840H760V760"/><path class="door" d="M635 840V780 A75 75 0 0 1 710 840"/><text x="660" y="884" class="room" font-size="22">주출입구</text>
 <g transform="translate(1160,180)"><text x="0" y="0" font-size="25" font-weight="800">적용 기준</text><line x1="0" y1="35" x2="70" y2="35" class="outer"/><text x="85" y="42" class="note">기존 외곽·벽체</text><line x1="0" y1="75" x2="70" y2="75" class="wall"/><text x="85" y="82" class="note">공간 구획</text><line x1="0" y1="115" x2="70" y2="115" class="glass"/><text x="85" y="122" class="note">유리·창호</text><text x="0" y="190" class="note">• 오픈 천장 / 기준 2,400</text><text x="0" y="222" class="note">• 배선 트레이 정리</text><text x="0" y="254" class="note">• 모든 실은 사무 용도</text><rect x="-15" y="315" width="285" height="150" rx="12" fill="#fff2d8" stroke="#c9953f" stroke-width="2"/><text x="0" y="350" font-size="21" font-weight="800">현장 확인 필요</text><text x="0" y="383" class="note">CAD 원본의 실치수·창호·</text><text x="0" y="413" class="note">기둥 중심선을 시공 전에 검토</text></g>
</svg>
